name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CATALOGUE_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalogue_integration_test?schema=public
      MAGIC_LINK_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/magic_link_integration_test?schema=public
      SESSIONS_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sessions_integration_test?schema=public
      PUBLIC_RESOURCES_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/public_resources_integration_test?schema=public
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json's packageManager field — passing
      # `version:` here too makes pnpm/action-setup fail on a version conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm exec prisma generate
      - name: Provision per-suite integration databases
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          for db in catalogue_integration_test magic_link_integration_test sessions_integration_test public_resources_integration_test; do
            createdb -h localhost -U postgres "$db"
          done
      - name: Apply Prisma migrations to integration databases
        working-directory: apps/api
        run: |
          for url in "$CATALOGUE_INTEGRATION_DATABASE_URL" "$MAGIC_LINK_INTEGRATION_DATABASE_URL" "$SESSIONS_INTEGRATION_DATABASE_URL" "$PUBLIC_RESOURCES_INTEGRATION_DATABASE_URL"; do
            DATABASE_URL="$url" pnpm exec prisma migrate deploy
          done
      - run: pnpm turbo run lint typecheck test

  design-detector:
    name: Design anti-pattern detector (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Impeccable's deterministic anti-pattern detector (vendored under
      # .claude/skills/impeccable, zero npm deps). Static scan of apps/web/src,
      # run from apps/web/ so it loads apps/web/DESIGN.md and flags colors and
      # fonts that drift off the design system. Contrast / rendered-color checks
      # need browser mode against a served page, so they stay a manual release
      # step, not CI. Non-blocking today (continue-on-error) — like the security
      # scanners; drop continue-on-error once the design system is bespoke and
      # you want design drift to gate merges.
      - name: Impeccable detector (apps/web)
        working-directory: apps/web
        run: node ../../.claude/skills/impeccable/scripts/detect.mjs src
        continue-on-error: true
