# Security scanning: secrets, SAST, and dependency vulnerabilities.
#
# The apps and packages now carry real source and dependencies (Layers 1-5),
# so the secret scan GATES merges: the Gitleaks job runs WITHOUT
# continue-on-error — a credential-shaped string in the diff or history fails
# the check, completing the "no hard-coded secrets" discipline gate.
#
# The pnpm dependency audit also GATES merges now: the runtime advisories
# (find-my-way, sharp) and postcss were bumped to patched versions via
# pnpm.overrides, and the residual dev-tooling advisories (vitest, vite,
# esbuild, brace-expansion, launch-editor — major bumps deferred) are recorded
# dated pnpm.auditConfig.ignoreGhsas exceptions, so the audit fails only on a
# NEW high/critical advisory. See docs/SECURITY.md.
#
# Semgrep (SAST) GATES too, now that it is tuned: scoped to apps/ + packages/
# with p/nodejsscan dropped. That ruleset was the whole reason the scan stayed
# advisory — its 52 findings were all false positives, vendored .claude/skills/
# noise, or supply-chain/CI policy suggestions, never a real vulnerability. The
# remaining rulesets run clean on first-party source, so any NEW finding blocks
# the merge. See docs/SECURITY.md.
#
# ZAP (dynamic scan against a running API) and MobSF (built APK/IPA scan) are
# deliberately not here — both need a live/built artifact, so they run
# manually at release time instead. See docs/SECURITY.md.
name: Security
on:
  pull_request:
  push: { branches: [main, develop] }
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Secret scan — flags credential-shaped strings in the diff/history.
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # SAST gate over first-party source (apps/ + packages/). p/nodejsscan is
      # dropped on purpose — on this code it produced only false positives (a
      # variable named `secret` read from config, `===` against null, a bounded
      # fixed-length regex read as ReDoS); see the 2026-07-29 triage in
      # docs/SECURITY.md. The scan is scoped to apps/ + packages/ so vendored
      # .claude/ scripts, CI YAML, and root manifests (supply-chain policy
      # noise) never gate merges. --error makes any finding fail the job.
      - name: Semgrep (SAST)
        run: >-
          semgrep scan
          --config p/typescript
          --config p/javascript
          --config p/owasp-top-ten
          --error
          --metrics off
          apps packages

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json's packageManager field — passing
      # `version:` here too makes pnpm/action-setup fail on a version conflict.
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Dependency audit — blocks the merge on a NEW high/critical advisory.
      # The six known dev-tooling advisories are excepted via
      # pnpm.auditConfig.ignoreGhsas (root package.json); see docs/SECURITY.md.
      - name: pnpm audit (dependency vulnerabilities)
        run: pnpm audit --audit-level=high
      # Guard: a muted advisory (pnpm.auditConfig.ignoreGhsas) must never be
      # reachable through the production graph — otherwise the global-scope
      # ignore would hide a real runtime vuln from the audit above. Re-runs the
      # audit against only prod deps with the ignores disabled. See docs/SECURITY.md.
      - name: Audit-ignore exceptions stay dev-only
        run: node scripts/audit-ignores-are-dev-only.mjs
