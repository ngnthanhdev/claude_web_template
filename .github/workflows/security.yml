# Security scanning: secrets, SAST, and dependency vulnerabilities.
#
# The apps and packages now carry real source and dependencies (Layers 1-5),
# so the secret scan GATES merges: the Gitleaks job runs WITHOUT
# continue-on-error — a credential-shaped string in the diff or history fails
# the check, completing the "no hard-coded secrets" discipline gate.
#
# The pnpm dependency audit also GATES merges now: the runtime advisories
# (find-my-way, sharp) and postcss were bumped to patched versions via
# pnpm.overrides, and the residual dev-tooling advisories (vitest, vite,
# esbuild, brace-expansion — major-version bumps deferred) are recorded as
# dated pnpm.auditConfig.ignoreGhsas exceptions, so the audit fails only on a
# NEW high/critical advisory. See docs/SECURITY.md.
#
# Semgrep (SAST) is the one job still on continue-on-error: its ruleset
# baseline is unconfirmed until the workflow runs once against real source.
# Flip it to blocking after a confirmed-clean (or explicitly-excepted) run.
#
# ZAP (dynamic scan against a running API) and MobSF (built APK/IPA scan) are
# deliberately not here — both need a live/built artifact, so they run
# manually at release time instead. See docs/SECURITY.md.
name: Security
on:
  pull_request:
  push: { branches: [main, develop] }
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Secret scan — flags credential-shaped strings in the diff/history.
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # SAST — becomes meaningful once apps/api and apps/web have real
      # TypeScript/JavaScript source for these rulesets to check.
      - name: Semgrep (SAST)
        run: >-
          semgrep ci
          --config p/typescript
          --config p/javascript
          --config p/owasp-top-ten
          --config p/nodejsscan
        continue-on-error: true

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Dependency audit — becomes meaningful once apps/web, apps/api, and
      # packages/shared carry real dependencies; the lockfile has nothing to
      # flag today.
      - name: pnpm audit (dependency vulnerabilities)
        run: pnpm audit --audit-level=high
